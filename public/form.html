<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVly — Створення резюме</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,255,255,0.07),
            transparent 35%
        ),
        #050505;

    color: #f5f5f5;
    line-height: 1.5;
    overflow-x: hidden;
}


/* =========================
   ОСНОВНИЙ КОНТЕЙНЕР
========================= */

.container {
    width: min(700px, calc(100% - 32px));
    margin: 0 auto;
    padding: 38px 0 70px;
}


/* =========================
   HEADER
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;

    margin-bottom: 18px;
}

.logo {
    color: #fff;

    font-size: 23px;
    font-weight: 800;

    letter-spacing: -1.3px;
}

.logo::first-letter {
    color: white;
}

.package {
    padding: 7px 13px;

    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.11),
            rgba(255,255,255,0.035)
        );

    color: #ddd;

    font-size: 13px;
    font-weight: 600;

    white-space: nowrap;

    box-shadow:
        inset 0 1px rgba(255,255,255,0.05);
}


/* =========================
   PROGRESS
========================= */

.progress-info {
    display: flex;
    justify-content: flex-end;

    margin-bottom: 8px;

    color: #777;

    font-size: 12px;
}

.progress {
    height: 5px;

    margin-bottom: 22px;

    background: rgba(255,255,255,0.08);

    border-radius: 999px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0;

    background:
        linear-gradient(
            90deg,
            #777,
            #fff
        );

    border-radius: 999px;

    box-shadow:
        0 0 12px rgba(255,255,255,0.2);

    transition: width 0.35s ease;
}


/* =========================
   MAIN BOX
========================= */

.box {
    position: relative;

    padding: 36px;

    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 17px;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(255,255,255,0.055),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            rgba(255,255,255,0.055),
            rgba(255,255,255,0.018)
        );

    box-shadow:
        0 30px 80px rgba(0,0,0,0.35),
        inset 0 1px rgba(255,255,255,0.04);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}


/* =========================
   QUESTION
========================= */

.emoji {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 20px;

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.1),
            rgba(255,255,255,0.025)
        );

    font-size: 22px;

    box-shadow:
        inset 0 1px rgba(255,255,255,0.06);
}

h1 {
    margin: 0 0 11px;

    color: #f5f5f5;

    font-size: 30px;
    line-height: 1.1;

    letter-spacing: -1.2px;
}

.description {
    margin: 0 0 27px;

    color: #858585;

    line-height: 1.65;
    font-size: 15px;
}


/* =========================
   INPUTS
========================= */

input,
textarea {
    width: 100%;

    padding: 15px 16px;

    margin-bottom: 12px;

    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;

    outline: none;

    background:
        rgba(255,255,255,0.035);

    color: #f5f5f5;

    font-family: inherit;
    font-size: 15px;

    transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

input::placeholder,
textarea::placeholder {
    color: #666;
}

input:hover,
textarea:hover {
    border-color: rgba(255,255,255,0.18);
}

input:focus,
textarea:focus {
    border-color: rgba(255,255,255,0.38);

    background:
        rgba(255,255,255,0.055);

    box-shadow:
        0 0 0 3px rgba(255,255,255,0.035);
}

textarea {
    min-height: 120px;

    resize: vertical;

    overflow-wrap: anywhere;
    word-break: break-word;
}


/* =========================
   CHOICES
========================= */

.choice {
    width: 100%;

    padding: 16px 17px;

    margin-bottom: 10px;

    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 11px;

    background:
        rgba(255,255,255,0.025);

    color: #ddd;

    font-family: inherit;
    font-size: 15px;

    text-align: left;

    cursor: pointer;

    transition:
        0.2s ease;
}

.choice:hover {
    border-color: rgba(255,255,255,0.28);

    background:
        rgba(255,255,255,0.055);

    transform: translateY(-1px);
}

.choice.selected {
    border-color: rgba(255,255,255,0.45);

    background:
        linear-gradient(
            135deg,
            #f2f2f2,
            #bcbcbc
        );

    color: #090909;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.25);
}


/* =========================
   BUTTONS
========================= */

.next {
    width: 100%;

    padding: 15px 18px;

    margin-top: 5px;

    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #f5f5f5,
            #cfcfcf
        );

    color: #050505;

    font-family: inherit;
    font-size: 15px;
    font-weight: 650;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.3);

    transition:
        0.2s ease;
}

.next:hover {
    transform: translateY(-2px);

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #dedede
        );

    box-shadow:
        0 15px 35px rgba(0,0,0,0.4);
}

.buttons {
    display: flex;
    gap: 10px;

    margin-top: 20px;
}

.buttons .next {
    flex: 1;
    margin-top: 0;
}

.back {
    padding: 14px 20px;

    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;

    background:
        rgba(255,255,255,0.04);

    color: #aaa;

    font-family: inherit;
    font-size: 15px;

    cursor: pointer;

    white-space: nowrap;

    transition: 0.2s ease;
}

.back:hover {
    border-color: rgba(255,255,255,0.2);

    background:
        rgba(255,255,255,0.07);

    color: white;
}

.skip {
    display: block;

    margin: 15px auto 0;

    border: none;
    background: none;

    color: #666;

    font-family: inherit;
    font-size: 13px;

    text-decoration: underline;

    cursor: pointer;
}

.skip:hover {
    color: #aaa;
}


/* =========================
   SKILLS
========================= */

.category-title {
    margin: 23px 0 10px;

    color: #777;

    font-size: 12px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 1px;
}

.category-title:first-child {
    margin-top: 0;
}

.skill-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;
}

.skill-button {
    width: 100%;

    padding: 12px;

    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 9px;

    background:
        rgba(255,255,255,0.025);

    color: #aaa;

    font-family: inherit;
    font-size: 13px;

    text-align: left;

    cursor: pointer;

    transition: 0.2s ease;
}

.skill-button:hover {
    border-color: rgba(255,255,255,0.22);

    background:
        rgba(255,255,255,0.05);

    color: white;
}

.skill-button.selected {
    border-color: rgba(255,255,255,0.3);

    background:
        #ededed;

    color: #090909;
}

.selected-count {
    padding: 10px 12px;

    margin-bottom: 15px;

    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 9px;

    background:
        rgba(255,255,255,0.03);

    color: #888;

    font-size: 13px;
}


/* =========================
   PROFILE CHOICE
========================= */

.profile-choice {
    padding: 17px;
}

.profile-choice strong {
    display: block;

    margin-bottom: 4px;

    font-weight: 650;
}

.profile-choice span {
    font-size: 13px;

    color: #777;
}

.profile-choice.selected span {
    color: #333;
}


/* =========================
   REVIEW
========================= */

.review {
    padding: 15px 0;

    border-bottom: 1px solid rgba(255,255,255,0.07);
}

.review-title {
    margin-bottom: 5px;

    color: #666;

    font-size: 12px;

    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.review-value {
    color: #ddd;

    line-height: 1.55;

    overflow-wrap: anywhere;
    word-break: break-word;

    white-space: pre-wrap;
}


/* =========================
   SUCCESS
========================= */

.success {
    text-align: center;
}

.success-icon {
    width: 75px;
    height: 75px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 20px;

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.1),
            rgba(255,255,255,0.025)
        );

    font-size: 34px;
}


/* =========================
   PHOTO
========================= */

.photo-upload {
    text-align: center;

    margin-bottom: 20px;
}

.photo-preview {
    width: 120px;
    height: 120px;

    display: block;

    margin: 0 auto 15px;

    border: 3px solid rgba(255,255,255,0.15);
    border-radius: 50%;

    object-fit: cover;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.3);
}

.photo-placeholder {
    width: 120px;
    height: 120px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 15px;

    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;

    background:
        rgba(255,255,255,0.04);

    color: #777;

    font-size: 42px;
}

.photo-label {
    display: inline-block;

    padding: 11px 17px;

    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 9px;

    background:
        rgba(255,255,255,0.06);

    color: #ddd;

    cursor: pointer;

    font-size: 14px;

    transition: 0.2s ease;
}

.photo-label:hover {
    border-color: rgba(255,255,255,0.3);

    background:
        rgba(255,255,255,0.1);
}

.photo-input {
    display: none;
}


/* =========================
   PREVIEW
========================= */

.preview-wrapper {
    margin-top: 25px;
}

.template-title {
    margin-bottom: 10px;

    color: #777;

    font-size: 12px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 1px;
}

.template-buttons {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 8px;

    margin-bottom: 20px;
}

.template-button {
    padding: 11px;

    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 9px;

    background:
        rgba(255,255,255,0.025);

    color: #999;

    font-family: inherit;
    font-size: 13px;

    cursor: pointer;

    transition: 0.2s ease;
}

.template-button:hover {
    border-color: rgba(255,255,255,0.23);

    color: white;
}

.template-button.selected {
    border-color: rgba(255,255,255,0.3);

    background:
        #ededed;

    color: #090909;
}


/* =========================
   CV PREVIEW
========================= */

.resume-preview {
    position: relative;

    width: 100%;

    background: white;

    overflow: hidden;

    border-radius: 4px;

    box-shadow:
        0 25px 60px rgba(0,0,0,0.45);

    user-select: none;
}

.resume-paper {
    position: relative;

    z-index: 1;

    min-height: 297mm;

    word-break: break-all;
}


/* =========================
   PDF A4
========================= */

.resume-preview.pdf-mode {
    width: 210mm !important;
    height: 297mm !important;

    min-height: 297mm !important;

    margin: 0 !important;

    border-radius: 0;

    box-shadow: none;

    overflow: hidden;

    box-sizing: border-box;
}

.resume-preview.pdf-mode .resume-paper {
    width: 210mm;

    min-height: 297mm;

    overflow: visible;
}

.resume-watermark {
    position: absolute;

    top: 45%;
    left: -20%;

    width: 140%;

    transform: rotate(-30deg);

    text-align: center;

    font-size: 34px;
    font-weight: 800;

    letter-spacing: 3px;

    color: rgba(0,0,0,0.09);

    z-index: 20;

    pointer-events: none;

    white-space: nowrap;
}

.resume-photo {
    width: 115px !important;
    height: 115px !important;
    object-fit: cover !important;
    object-position: center !important;
    aspect-ratio: 1 / 1;
    display: block;
    border-radius: 50%;
}

.resume-no-photo {
    width: 115px;
    height: 115px;
    flex: 0 0 115px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
    overflow: hidden;

    background: #eee;
}


/* =========================
   MODERN CV
========================= */

.resume-modern .resume-paper {
    padding: 38px;
}

.modern-top {
    display: flex;
    align-items: center;

    gap: 22px;

    padding-bottom: 25px;

    border-bottom: 3px solid #222;
}

.modern-name {
    margin-bottom: 6px;

    font-size: 29px;
    font-weight: bold;
    color: #222 !important;
}

.modern-position {
    margin-bottom: 12px;

    color: #666;

    font-size: 16px;
}

.modern-contact {
    color: #777;

    font-size: 12px;
    line-height: 1.5;
}

.modern-section {
    margin-top: 24px;
}

.modern-title {
    margin-bottom: 9px;

    font-size: 12px;
    font-weight: bold;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}

.modern-text {
    color: #444;

    font-size: 13px;

    line-height: 1.55;
}

.modern-columns {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 25px;
}

.modern-skill {
    display: inline-block;

    padding: 6px 8px;

    margin: 0 4px 5px 0;

    border-radius: 6px;

    background: #f0f0f0;

    font-size: 11px;
}


/* =========================
   MINIMAL CV
========================= */

.resume-minimal .resume-paper {
    padding: 48px;
}

.minimal-header {
    padding-bottom: 25px;

    border-bottom: 1px solid #ccc;

    text-align: center;
}

.minimal-photo {
    margin-bottom: 15px;
}

.minimal-name {
    font-size: 32px;
    font-weight: 300;

    letter-spacing: 1px;
}

.minimal-position {
    margin-top: 8px;

    color: #777;

    font-size: 14px;
}

.minimal-contact {
    margin-top: 12px;

    color: #888;

    font-size: 11px;
}

.minimal-section {
    margin-top: 28px;
}

.minimal-title {
    margin-bottom: 10px;

    color: #777;

    font-size: 11px;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.minimal-text {
    color: #444;

    font-size: 13px;

    line-height: 1.6;
}

.minimal-skill {
    display: inline-block;

    margin-right: 12px;
    margin-bottom: 7px;

    font-size: 12px;
}


/* =========================
   CREATIVE CV
========================= */

.resume-creative .resume-paper {
    display: grid !important;
    grid-template-columns: 34% 66% !important;
    padding: 0 !important;
    background: #fff !important;
}

.resume-creative .creative-side {
    grid-column: 1 !important;
    grid-row: 1 !important;
    background: #222 !important;
    color: #fff !important;
    padding: 30px 22px !important;
}

.resume-creative .creative-main {
    grid-column: 2 !important;
    grid-row: 1 !important;
    background: #fff !important;
    color: #222 !important;
    padding: 35px 28px !important;
}

.resume-creative .creative-side {
    grid-column: 1;
}

.resume-creative .creative-main {
    grid-column: 2;
    background: #fff !important;
}

.creative-side {
    padding: 30px 22px;
    background: #222 !important;
    color: #fff !important;
}

.creative-main {
    padding: 35px 28px;
    background: #fff !important;
    color: #222 !important;
}

.creative-side .resume-photo,
.creative-side .resume-no-photo {
    margin: 0 auto 25px;
}

.creative-name {
    margin-bottom: 7px;

    font-size: 23px;
    font-weight: bold;

    text-align: center;
}

.creative-position {
    color: #ccc;

    font-size: 12px;

    line-height: 1.4;

    text-align: center;
}

.creative-side-title {
    margin-top: 30px;
    margin-bottom: 10px;

    color: #bbb;

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}

.creative-side-text {
    color: #ddd;

    font-size: 11px;

    line-height: 1.55;
}

.creative-main-title {
    margin-bottom: 10px;

    padding-bottom: 6px;

    border-bottom: 1px solid #ddd;

    font-size: 12px;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}

.creative-main-section {
    margin-bottom: 27px;
}

.creative-main-text {
    color: #444;

    font-size: 13px;

    line-height: 1.55;
}

.creative-skill {
    display: inline-block;

    padding: 6px 8px;

    margin: 0 5px 5px 0;

    border-radius: 5px;

    background: #eee;

    font-size: 11px;
}


/* =========================
   PREVIEW / PURCHASE
========================= */

.preview-note {
    padding: 17px;

    margin-top: 20px;

    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 11px;

    background:
        rgba(255,255,255,0.035);

    color: #888;

    font-size: 13px;

    line-height: 1.6;
}

.preview-price {
    margin-top: 15px;

    color: #999;

    font-size: 14px;

    text-align: center;
}

.buy-button {
    width: 100%;

    padding: 16px;

    margin-top: 12px;

    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #f5f5f5,
            #cfcfcf
        );

    color: #050505;

    font-family: inherit;
    font-size: 16px;
    font-weight: 650;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.3);

    transition: 0.2s ease;
}

.buy-button:hover {
    transform: translateY(-2px);

    background:
        linear-gradient(
            135deg,
            white,
            #ddd
        );
}

.preview-blur {
    filter: blur(1.3px);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {
        width: min(100% - 20px, 700px);

        padding-top: 20px;
        padding-bottom: 40px;
    }

    .box {
        padding: 25px 18px;

        border-radius: 14px;
    }

    h1 {
        font-size: 25px;
    }

    .logo {
        font-size: 20px;
    }

    .skill-grid {
        grid-template-columns: 1fr;
    }

    .buttons {
        flex-direction: column-reverse;
    }

    .buttons .back {
        width: 100%;
    }

    .template-buttons {
        grid-template-columns: 1fr;
    }

    .resume-paper {
        transform-origin: top left;
    }

    .resume-preview {
        overflow-x: auto;
    }

    .resume-modern .resume-paper {
        padding: 25px;

        min-width: 520px;
    }

    .resume-minimal .resume-paper {
        padding: 30px;

        min-width: 520px;
    }

    .resume-creative .resume-paper {
        min-width: 520px;
    }

    .photo-preview,
    .photo-placeholder {
        width: 105px;
        height: 105px;
    }
}

/* =========================
   PHOTO CROPPER
========================= */

.photo-crop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
}

.photo-crop-modal {
    width: min(440px, 100%);
    background: #181818;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
    text-align: center;
}

.photo-crop-modal h2 {
    margin: 0 0 8px;
    color: #ffffff;
}

.photo-crop-modal p {
    margin: 0 0 22px;
    color: #a9a9a9;
    font-size: 14px;
    line-height: 1.5;
}

.photo-crop-area {
    width: 320px;
    height: 320px;
    max-width: 100%;
    margin: 0 auto;
    border-radius: 18px;
    overflow: hidden;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.photo-crop-area::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 18px;
    pointer-events: none;
}

.photo-crop-image {
    position: absolute;
    width: auto;

function openPhotoCropper(imageSrc, area) {

    var overlay = document.createElement("div");
    overlay.className = "photo-crop-overlay";

    var modal = document.createElement("div");
    modal.className = "photo-crop-modal";

    var title = document.createElement("h2");
    title.textContent = "Налаштуй фото";

    var description = document.createElement("p");
    description.textContent =
        "Перетягни фото та вибери потрібну частину.";

    var cropArea = document.createElement("div");
    cropArea.className = "photo-crop-area";

    var img = document.createElement("img");

img.src = imageSrc;

img.className = "photo-crop-image";

img.draggable = false;

    cropArea.appendChild(img);


    /* =========================
       ПОЗИЦІЯ ФОТО
    ========================= */

    var scale = 1;
    var positionX = 0;
    var positionY = 0;

    var baseScale = 1;

    var dragging = false;
    var startX = 0;
    var startY = 0;


    function updateImage() {

    var cropSize = cropArea.clientWidth;

    var imageWidth = img.naturalWidth;
    var imageHeight = img.naturalHeight;

    if (!imageWidth || !imageHeight) {
        return;
    }

    /*
     * Автоматично підганяємо фото
     * під квадрат.
     */

    baseScale = Math.max(
        cropSize / imageWidth,
        cropSize / imageHeight
    );

    var finalScale =
        baseScale * scale;

    img.style.width =
        (imageWidth * finalScale) + "px";

    img.style.height =
        (imageHeight * finalScale) + "px";

    img.style.transform =
        "translate(-50%, -50%) translate(" +
        positionX +
        "px, " +
        positionY +
        "px)";

}


    /* =========================
       ПЕРЕТЯГУВАННЯ МИШКОЮ
    ========================= */

    img.onmousedown = function(event) {

        event.preventDefault();

        dragging = true;

        startX =
            event.clientX - positionX;

        startY =
            event.clientY - positionY;

    };


    document.onmousemove = function(event) {

        if (!dragging) {
            return;
        }

        positionX =
            event.clientX - startX;

        positionY =
            event.clientY - startY;

        updateImage();

    };


    document.onmouseup = function() {

        dragging = false;

    };


    /* =========================
       ПЕРЕТЯГУВАННЯ НА ТЕЛЕФОНІ
    ========================= */

    img.ontouchstart = function(event) {

        if (event.touches.length !== 1) {
            return;
        }

        var touch = event.touches[0];

        dragging = true;

        startX =
            touch.clientX - positionX;

        startY =
            touch.clientY - positionY;

    };


    img.ontouchmove = function(event) {

        if (!dragging) {
            return;
        }

        event.preventDefault();

        var touch = event.touches[0];

        positionX =
            touch.clientX - startX;

        positionY =
            touch.clientY - startY;

        updateImage();

    };


    img.ontouchend = function() {

        dragging = false;

    };


    /* =========================
       МАСШТАБ КОЛЕСОМ
    ========================= */

    cropArea.onwheel = function(event) {

        event.preventDefault();

        if (event.deltaY < 0) {

            scale += 0.1;

        } else {

            scale -= 0.1;

        }

        if (scale < 1) {
            scale = 1;
        }

        if (scale > 3) {
            scale = 3;
        }

        updateImage();

    };


    /* =========================
       КНОПКИ МАСШТАБУ
    ========================= */

    var controls =
        document.createElement("div");

    controls.className =
        "photo-crop-controls";


    var minus =
        document.createElement("button");

    minus.type = "button";
    minus.className = "crop-control";
    minus.textContent = "−";


    var plus =
        document.createElement("button");

    plus.type = "button";
    plus.className = "crop-control";
    plus.textContent = "+";


    plus.onclick = function() {

        scale += 0.1;

        if (scale > 3) {
            scale = 3;
        }

        updateImage();

    };


    minus.onclick = function() {

        scale -= 0.1;

        if (scale < 1) {
            scale = 1;
        }

        updateImage();

    };


    controls.appendChild(minus);
    controls.appendChild(plus);


    /* =========================
       КНОПКИ
    ========================= */

    var buttons =
        document.createElement("div");

    buttons.className =
        "photo-crop-buttons";


    var cancel =
        document.createElement("button");

    cancel.type = "button";
    cancel.className = "back";
    cancel.textContent = "Скасувати";


    cancel.onclick = function() {

        document.onmousemove = null;
        document.onmouseup = null;

        overlay.remove();

    };


    var apply =
        document.createElement("button");

    apply.type = "button";
    apply.className = "next";
    apply.textContent = "Застосувати";


    apply.onclick = function() {

        document.onmousemove = null;
        document.onmouseup = null;

        createCroppedPhoto(
            img,
            scale,
            positionX,
            positionY,
            function(croppedImage) {

                answers.photo =
                    croppedImage;

                overlay.remove();

                showQuestion();

            }
        );

    };


    buttons.appendChild(cancel);
    buttons.appendChild(apply);


    modal.appendChild(title);
    modal.appendChild(description);
    modal.appendChild(cropArea);
    modal.appendChild(controls);
    modal.appendChild(buttons);

    overlay.appendChild(modal);

    document.body.appendChild(overlay);

    if (img.complete) {
    updateImage();
} else {
    img.onload = function() {
        updateImage();
    };
}


}


function createCroppedPhoto(
    img,
    scale,
    positionX,
    positionY,
    callback
) {

    var canvas = document.createElement("canvas");

    var size = 600;

    canvas.width = size;
    canvas.height = size;

    var ctx = canvas.getContext("2d");

    var image = new Image();

    image.onload = function() {

        var cropSize = 320;

        /*
         * Визначаємо базовий масштаб,
         * щоб фото повністю закривало квадрат.
         */

        var baseScale = Math.max(
            cropSize / image.width,
            cropSize / image.height
        );

        var finalScale =
            baseScale * scale;

        /*
         * Розмір фото після масштабу
         */

        var displayedWidth =
            image.width * finalScale;

        var displayedHeight =
            image.height * finalScale;

        /*
         * Початкове положення фото по центру
         */

        var left =
            (cropSize - displayedWidth) / 2;

        var top =
            (cropSize - displayedHeight) / 2;

        /*
         * Додаємо те, наскільки
         * користувач посунув фото.
         */

        left += positionX;
        top += positionY;

        /*
         * Яку частину оригінального фото
         * потрібно взяти.
         */

        var sourceX =
            -left / finalScale;

        var sourceY =
            -top / finalScale;

        var sourceWidth =
            cropSize / finalScale;

        var sourceHeight =
            cropSize / finalScale;


        /*
         * Захист від виходу за межі фото
         */

        if (sourceX < 0) {
            sourceX = 0;
        }

        if (sourceY < 0) {
            sourceY = 0;
        }

        if (
            sourceX + sourceWidth >
            image.width
        ) {

            sourceWidth =
                image.width - sourceX;

        }

        if (
            sourceY + sourceHeight >
            image.height
        ) {

            sourceHeight =
                image.height - sourceY;

        }


        /*
         * Малюємо обрізане фото
         */

        ctx.drawImage(
            image,
            sourceX,
            sourceY,
            sourceWidth,
            sourceHeight,
            0,
            0,
            size,
            size
        );


        /*
         * Зберігаємо як JPEG
         */

        callback(
            canvas.toDataURL(
                "image/jpeg",
                0.9
            )
        );

    };


    image.src = img.src;

}

function goNext() {

    var q =
        questions[step];

    var input =
        document.getElementById("currentInput");

    if (input) {

        answers[q.id] =
            input.value.trim();

    }

    if (
        step <
        questions.length - 1
    ) {

        step++;

        showQuestion();

    } else {

        showResult();

    }
}


/* =========================
   НАЗАД
========================= */

function goBack() {

    // Якщо зараз відкритий перегляд резюме
    if (document.getElementById("resumeContainer")) {
        showReview();
        return;
    }

    // Якщо зараз на перевірці даних
    if (document.querySelector(".review")) {
        step = questions.length - 1;
        showQuestion();
        return;
    }

    // Звичайне повернення між питаннями
    if (step > 0) {

        step--;

        showQuestion();

    } else {

        showPackageSelection();

    }

}

function formatExperience() {

    if (!answers.experience) {
        return "";
    }

    if (
        typeof answers.experience === "string"
    ) {

        return answers.experience;

    }

    var e =
        answers.experience;

    return (
        (e.type || "") +
        "<br>" +
        (e.company || "") +
        "<br>" +
        (e.position || "") +
        "<br>" +
        (e.period || "") +
        "<br>" +
        (e.duties || e.description || "")
    );

}


/* =========================
   ФОРМАТ ОСВІТИ
========================= */

function formatEducation() {

    if (!answers.education) {

        return (
            answers.educationLevel ||
            ""
        );

    }

    if (
        typeof answers.education === "string"
    ) {

        return answers.education;

    }

    var e =
        answers.education;

    return (
        (e.level || "") +
        "<br>" +
        (e.institution || "") +
        "<br>" +
        (e.specialty || "") +
        "<br>" +
        (e.years || "")
    );

}


/* =========================
   РЯДОК ПЕРЕВІРКИ
========================= */

function review(title, value) {

    if (!value) {
        value = "Не вказано";
    }

    return (
        '<div class="review">' +
        '<div class="review-title">' +
        title +
        '</div>' +
        '<div class="review-value">' +
        value +
        '</div>' +
        '</div>'
    );

}

function changeTemplate(template) {

    selectedTemplate = template;

    var container =
        document.getElementById("resumeContainer");

    if (!container) {
        return;
    }


    var modernButton =
        document.getElementById("template-modern");

    var minimalButton =
        document.getElementById("template-minimal");

    var creativeButton =
        document.getElementById("template-creative");


    modernButton.classList.remove("selected");
    minimalButton.classList.remove("selected");
    creativeButton.classList.remove("selected");


    if (template === "modern") {

        modernButton.classList.add("selected");

        container.innerHTML = createModernResume(
            answers.photo
                ? '<img src="' + answers.photo + '" class="resume-photo">'
                : '<div class="resume-no-photo">👤</div>',
            answers.name || "Твоє ім'я",
            answers.position || "Бажана посада",
            answers.location || "Місто",
            answers.email || "email@example.com",
            answers.about ||
                "Професійний кандидат, орієнтований на розвиток.",
            createSkillsModern(),
            createExperiencePreview(),
            createEducationPreview()
        );

    }


    if (template === "minimal") {

        minimalButton.classList.add("selected");

        container.innerHTML =
            createMinimalResume();

    }


    if (template === "creative") {

        creativeButton.classList.add("selected");

        container.innerHTML =
            createCreativeResume();

    }

}

async function startPayment() {

    var resume = document.getElementById("resumeContainer");

    if (!resume) {
        alert("Резюме ще не створене.");
        return;
    }

    var clone = resume.cloneNode(true);

    var watermarks = clone.querySelectorAll(".resume-watermark");
    for (var i = 0; i < watermarks.length; i++) {
        watermarks[i].remove();
    }

    var blurred = clone.querySelectorAll(".preview-blur");
    for (var i = 0; i < blurred.length; i++) {
        blurred[i].classList.remove("preview-blur");
    }

    var styles = Array.from(document.querySelectorAll("style"))
        .map(function(style) {
            return style.textContent;
        })
        .join("\n");

    var paymentResponse = await fetch("/create-cryptopayr-payment", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            amount: packagePrices[packageType],
            currency: "UAH",
            metadata: "cvly-" + Date.now(),
            resume: answers,
            html: clone.outerHTML,
            css: styles
        })
    });

    var paymentResult = await paymentResponse.json();

    if (!paymentResult.success) {
        alert("Не вдалося створити платіж 😔");
        console.error(paymentResult);
        return;
    }

    window.location.href = paymentResult.checkout_url;
    return;
    var resume = document.getElementById("resumeContainer");

console.log("ОРИГІНАЛ:", resume.outerHTML.substring(0, 300));

    if (!resume) {
        alert("Резюме ще не створене.");
        return;
    }

    var clone = resume.cloneNode(true);
    clone.style.background = "white";
    clone.querySelector(".resume-preview").classList.add("pdf-mode");
console.log("RESUME CONTAINER:", resume.offsetWidth, resume.offsetHeight);
console.log("CLONE:", clone.offsetWidth, clone.offsetHeight);
console.log("PREVIEW У CLONE:", clone.querySelector(".resume-preview") ? clone.querySelector(".resume-preview").offsetWidth + " x " + clone.querySelector(".resume-preview").offsetHeight : "НЕМАЄ");

clone.style.height = "297mm";
clone.style.minHeight = "297mm";

clone.style.padding = "0";
clone.style.overflow = "hidden";
clone.style.boxSizing = "border-box";

    var watermarks = clone.querySelectorAll(".resume-watermark");

    for (var i = 0; i < watermarks.length; i++) {
        watermarks[i].remove();
    }

    var blurred = clone.querySelectorAll(".preview-blur");

    for (var i = 0; i < blurred.length; i++) {
        blurred[i].classList.remove("preview-blur");
    }

    var styles = Array.from(document.querySelectorAll("style"))
    .map(function(style) {
        return style.textContent;
    })
    .join("\n");

    try {

        var response = await fetch("/generate-pdf", {

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
    html: clone.outerHTML,

})

});
        if (!response.ok) {

var result = await response.json();

if (!result.success) {

}

alert("Резюме успішно відправлено на твою пошту ❤️");
